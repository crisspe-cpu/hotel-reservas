name: Laravel CI

on:
  push:
    branches:
      - main
      - devops-integration

  pull_request:
    branches:
      - main

jobs:
  laravel-tests:

    runs-on: ubuntu-latest

    steps:

    # 1. Clonar repositorio
    - name: Clonar repositorio
      uses: actions/checkout@v4

    # 2. Configurar PHP
    - name: Configurar PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.2
        extensions: mbstring, bcmath, pdo, sqlite, pdo_sqlite
        coverage: none

    # 3. Instalar Composer
    - name: Instalar Composer
      run: composer install --no-interaction --prefer-dist

    # 4. Configurar Node
    - name: Configurar Node
      uses: actions/setup-node@v4
      with:
        node-version: 18

    # 5. Instalar dependencias frontend
    - name: Instalar NPM
      run: npm install

    # 6. Build frontend
    - name: Build Vite
      run: npm run build

    # 7. Configurar entorno
    - name: Copiar .env
      run: cp .env.example .env

    - name: Generar APP_KEY
      run: php artisan key:generate

    # 8. Crear SQLite
    - name: Crear SQLite
      run: |
        mkdir -p database
        touch database/database.sqlite

    # 9. Configurar SQLite
    - name: Configurar SQLite
      run: |
        sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
        sed -i 's#DB_DATABASE=.*#DB_DATABASE=database/database.sqlite#' .env

    # 10. Permisos
    - name: Configurar permisos
      run: chmod -R 777 storage bootstrap/cache

    # 11. Migraciones
    - name: Ejecutar migraciones
      run: php artisan migrate --force

    # 12. Ejecutar tests
    - name: Ejecutar tests
      run: php artisan test